# Matched to bat_HybridComm_5M_45.yaml, used in results.ipynb.
# Run with --config=qmix_ExpoComm_one_peer_n7_cont --env-config=MAgent_Battle.
# Keep contrastive ExpoComm; disable the mixer for independent Q-learning.
learner: "cont_q_learner"
mixer: null
attention_dim: 32

test_greedy: True
test_nepisode: 1
test_interval: 50000
log_interval: 50000
runner_log_interval: 10000
learner_log_interval: 10000

epsilon_anneal_time: 1000000 # 25-50% of t_max

global_reward: True

buffer_size: 2000
target_update_interval_or_tau: 200

batch_size: 32
t_max: 5050000

save_model_interval: 500000

gamma: 0.99
lr: 0.0005

seed: 43
env_args:
  minimap_mode: False
  global_reward: True
  map_size: 25
  seed: 43

name: "bat_ExpoComm_IQL_5M_43"
